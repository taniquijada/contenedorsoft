name: tarea1-mysql

services:
  db:
    image: mysql:9.7.2
    container_name: tarea1_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-raiz_local_26o}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-proyecto}
      MYSQL_USER: ${MYSQL_USER:-proyecto}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-practica_local_26o}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - datos_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  phpmyadmin:
    image: phpmyadmin:5.2.3
    container_name: tarea1_phpmyadmin
    ports:
      - "127.0.0.1:${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos_mysql: